services:
  mailora-classifier:
    build:
      context: .
      dockerfile: Dockerfile
    image: mailora-classifier:v1.1.0
    container_name: mailora-email-classifier
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
      - HOST=0.0.0.0
      - MODEL_TYPE=baseline
      - MODEL_DIR=/app/artifacts
      - WORKERS=2
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
